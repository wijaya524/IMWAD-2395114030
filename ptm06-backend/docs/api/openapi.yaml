openapi: 3.0.3
info:
  title: Daily Life Education Game - Telemetry API
  version: 1.0.0
  description: >
    API Telemetri dan Bimbingan Adaptif untuk Game Edukasi Bina Diri Anak Tunagrahita.
    Mencakup ingest log permainan serta pelacakan inferensi AI adaptif.
servers:
  - url: http://localhost:3000/api/v1
    description: Development Server (Next.js Local)
  - url: https://api.dailylife-game.edu/api/v1
    description: Production Server (Placeholder)
paths:
  /telemetry/sessions:
    post:
      summary: Sinkronisasi log sesi permainan dan audit inferensi AI adaptif
      description: >
        Menerima batch log interaksi siswa dari perangkat lokal, mencakup data evaluasi
        aturan dan audit inferensi AI bimbingan adaptif jika terjadi kesalahan berulang.
        [ASUMSI-01]: Endpoint LLD '/telemetry/sessions/sync' disesuaikan menjadi RESTful noun jamak '/telemetry/sessions'.
      tags:
        - Telemetry
        - AI
      parameters:
        - in: header
          name: X-App-Version
          required: true
          schema:
            type: string
            example: "1.0.0"
        - in: header
          name: X-Device-Signature
          required: true
          schema:
            type: string
            example: "hmac_sha256_hash_value"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSyncPayload'
      responses:
        '201':
          description: Data sesi berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Format JSON atau enum tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature perangkat tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Ukuran payload melampaui 500 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Pelanggaran integritas data (misal completed_at < started_at)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Kesalahan internal server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Layanan telemetri sedang dalam pemeliharaan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ModuleType:
      type: string
      enum:
        - WAKE_UP
        - BATHING
        - BRUSHING_TEETH
        - WEARING_UNIFORM
        - PREPARING_BOOKS
        - BREAKFAST
        - FAREWELL
    DirectiveType:
      type: string
      enum:
        - NONE
        - GENERAL_HINT
        - SPECIFIC_VISUAL_CUE
        - FALLBACK_STATIC
    AdaptiveHint:
      type: object
      required:
        - confidence_score
        - directive_type
        - is_fallback
        - execution_time_ms
      properties:
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.86
        directive_type:
          $ref: '#/components/schemas/DirectiveType'
        is_fallback:
          type: boolean
          example: false
        execution_time_ms:
          type: integer
          minimum: 0
          maximum: 3000
          example: 32
    InteractionLog:
      type: object
      required:
        - module_type
        - selected_object_id
        - is_correct
        - attempt_index
        - timestamp
      properties:
        module_type:
          $ref: '#/components/schemas/ModuleType'
        selected_object_id:
          type: string
          example: "ITEM_TOY_ROBOT"
        is_correct:
          type: boolean
          example: false
        attempt_index:
          type: integer
          minimum: 1
          example: 2
        timestamp:
          type: string
          format: date-time
          example: "2026-09-20T07:18:16Z"
        ai_hint:
          $ref: '#/components/schemas/AdaptiveHint'
    SessionSyncPayload:
      type: object
      required:
        - session_id
        - device_pseudo_id
        - started_at
        - is_completed
        - interactions
      properties:
        session_id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        device_pseudo_id:
          type: string
          example: "PSEUDO_DEV_8F91A0B2"
        started_at:
          type: string
          format: date-time
          example: "2026-09-20T07:15:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-20T07:22:15Z"
        is_completed:
          type: boolean
          example: true
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/InteractionLog'
    SuccessResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Session telemetry successfully ingested."
        data:
          type: object
          properties:
            session_id:
              type: string
              format: uuid
            synced_records_count:
              type: integer
            ingested_at:
              type: string
              format: date-time
    ErrorResponse:
      type: object
      required:
        - status
        - error_code
        - message
      properties:
        status:
          type: string
          example: "ERROR"
        error_code:
          type: string
          example: "ERR_INVALID_SCHEMA"
        message:
          type: string
          example: "Invalid JSON schema format or unexpected values."